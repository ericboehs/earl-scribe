AllCops:
  TargetRubyVersion: 2.6
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - ".bundle/**/*"
    - ".claude/**/*"
    - ".ruby-lsp/**/*"
    - "bin/**/*"
    - "vendor/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120

Gemspec/DevelopmentDependencies:
  Enabled: false

Naming/PredicateMethod:
  Enabled: false

Style/Documentation:
  Enabled: false

Metrics/ClassLength:
  Max: 140
  Exclude:
    - "test/**/*"

Metrics/ModuleLength:
  Max: 140

Metrics/MethodLength:
  Max: 16
  Exclude:
    - "test/**/*"

Metrics/AbcSize:
  Max: 20
  Exclude:
    - "test/**/*"

Metrics/ParameterLists:
  Max: 7
  Exclude:
    - "test/**/*"

Metrics/BlockLength:
  Exclude:
    - "test/**/*"
    - "earl-scribe.gemspec"

Lint/EmptyBlock:
  Exclude:
    - "test/**/*"

Lint/UnusedBlockArgument:
  Exclude:
    - "test/**/*"

Lint/UnusedMethodArgument:
  Exclude:
    - "test/**/*"

Lint/UnderscorePrefixedVariableName:
  Exclude:
    - "test/**/*"

Style/Semicolon:
  Exclude:
    - "test/test_helper.rb"

Style/ClassAndModuleChildren:
  Exclude:
    - "test/test_helper.rb"

Style/OneClassPerFile:
  Exclude:
    - "test/test_helper.rb"

Naming/RescuedExceptionsVariableName:
  PreferredName: error
