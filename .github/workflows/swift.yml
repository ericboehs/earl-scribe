name: Swift CI

on:
  pull_request:
    paths:
      - 'macos/**'
  push:
    branches: [ main ]
    paths:
      - 'macos/**'

jobs:
  test:
    runs-on: macos-15

    defaults:
      run:
        working-directory: macos/EarlScribe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test
